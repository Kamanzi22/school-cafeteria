name: Ping backend every 5 minutes

# Purpose: hit /api/health often enough that Render never sees 15 minutes of
# silence (which triggers its free-tier spin-down) and Supabase never sees 7
# days of silence (which triggers its free-tier pause). /api/health runs a
# real `SELECT 1` against the DB, so this ping covers both at once.
#
# Honest limits of this approach: GitHub Actions schedules are best-effort.
# 5 minutes is the platform's minimum interval, and during high-load periods
# (especially runs scheduled for :00) GitHub can delay a run by 30-60 minutes
# or skip it silently. That's still comfortably inside Supabase's 7-day pause
# window, but it means a cold start can still slip through occasionally on
# Render. A paid always-on Render instance, or an external monitor like
# UptimeRobot/cron-job.org, is the only way to fully close that last gap.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: curl -sf --retry 3 --retry-delay 10 --max-time 60 https://cafecampus-api-feu3.onrender.com/api/health
