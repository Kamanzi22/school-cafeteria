name: Backup database to Supabase Storage

# Free Supabase has no automated backups. This job dumps the DB and uploads
# it to a PRIVATE Supabase Storage bucket instead of committing it anywhere
# in this repo — this repo is public, so a dump committed here (or even
# attached as a workflow artifact) would leak customer emails, order data,
# and password hashes to anyone on the internet. Storage stays server-side
# and private as long as the "backups" bucket below is not marked public.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DIRECT_URL       Postgres connection string. Use the Session pooler
#                             URI (port 5432), not the "Direct connection" one —
#                             GitHub-hosted runners lack outbound IPv6, and
#                             Supabase's direct connection is IPv6-only on free
#                             tier. The Session pooler supports IPv4 and (unlike
#                             the transaction pooler) session-level connections,
#                             which pg_dump needs.
#   SUPABASE_URL              e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY service role key (Project Settings -> API) — never expose this client-side
#
# One-time setup in the Supabase dashboard: Storage -> New bucket -> name it
# "backups" -> leave "Public bucket" UNCHECKED.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        # Ubuntu's default postgresql-client is v16, but Supabase runs Postgres
        # 17 — pg_dump refuses to dump from a newer major server version, so
        # pull the matching client from the official PGDG apt repo instead.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          STAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          pg_dump "$DIRECT_URL" --no-owner --no-privileges -Fc -f "backup-$STAMP.dump"

      - name: Upload to private Supabase Storage bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST \
            "$SUPABASE_URL/storage/v1/object/backups/db/backup-$STAMP.dump" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@backup-$STAMP.dump"

      - name: Delete local dump
        if: always()
        run: rm -f backup-*.dump

      - name: Prune backups older than 14 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CUTOFF=$(date -u -d '14 days ago' +%Y-%m-%dT%H-%M-%SZ)
          curl -sf "$SUPABASE_URL/storage/v1/object/list/backups" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"db/"}' \
          | grep -o '"name":"[^"]*"' | cut -d'"' -f4 \
          | while read -r name; do
              [ -z "$name" ] && continue
              file_stamp=$(echo "$name" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z')
              if [ -n "$file_stamp" ] && [ "$file_stamp" \< "$CUTOFF" ]; then
                curl -sf -X DELETE "$SUPABASE_URL/storage/v1/object/backups/db/$name" \
                  -H "Authorization: Bearer $SERVICE_ROLE_KEY"
              fi
            done
