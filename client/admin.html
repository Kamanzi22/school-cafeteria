<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <!-- Own HTML shell (not index.html) for the /admin* and /restaurant/auth* restaurant-owner
       routes — see render.yaml. A separate static entry, rather than swapping the manifest link
       with JS after mount, is what makes "Install app" here install AS the restaurant app
       instead of the customer one: the browser decides installability from whatever manifest is
       already in the page it fetched, before any React code runs, so there's no race to lose. -->
  <link rel="manifest" href="/manifest-restaurant.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="cafecampus-resto" />
  <title>cafecampus-resto</title>
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <!-- Opens the connection to the API while the app's code is still downloading, so the first
       request doesn't also pay for the connection setup (~0.3 s from Rwanda). -->
  <link rel="preconnect" href="%VITE_BACKEND_URL%" crossorigin />
  <!-- Painted the moment the page arrives, before the app's code has downloaded: the app's
       background and logo instead of a blank screen. React replaces the logo when the app starts. -->
  <style>
    /* :where() has no specificity, so the app's own body colours always win once its CSS loads */
    :where(body) { background: #f7f7f8; margin: 0; }
    #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot-splash img { width: 56px; height: 56px; animation: boot-pulse 1.4s ease-in-out infinite; }
    @keyframes boot-pulse { 50% { opacity: .45; } }
  </style>
</head>
<body>
  <div id="root"><div id="boot-splash"><img src="/logo-mark.svg" alt="" /></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
