<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121212" />
  <!-- Lets phones install the site to the home screen — required for push notifications on iPhone. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="CaféCampus" />
  <!-- restaurant. and superadmin. subdomains are served this same page (Render rewrites can't
       match on host), so set their app identity here, while the head is still being parsed —
       before Safari or Chrome read the manifest or home-screen name. usePwaScope keeps them in
       sync afterwards as routes change. -->
  <script>
    (function () {
      var apps = {
        restaurant: ['/manifest-restaurant.webmanifest', 'cafecampus-resto'],
        superadmin: ['/manifest-superadmin.webmanifest', 'cafecampus-admin']
      }
      var app = apps[location.hostname.split('.')[0]]
      if (!app) return
      document.querySelector('link[rel="manifest"]').setAttribute('href', app[0])
      document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', app[1])
    })()
  </script>
  <!-- Static baseline for crawlers/link-preview bots that don't execute JS (Bing, WhatsApp,
       iMessage, Twitter, Facebook). Helmet (see src/components/Seo.jsx) overrides these per
       route for JS-capable crawlers like Googlebot — this tag is what everyone else sees. -->
  <title>CaféCampus — Order. Track. Eat.</title>
  <meta name="description" content="Order food from campus restaurants, track your order live, and skip the line. Browse menus from campus eateries and pay on pickup or delivery." />
  <link rel="canonical" href="https://cafecampus-client.onrender.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CaféCampus" />
  <meta property="og:title" content="CaféCampus — Order. Track. Eat." />
  <meta property="og:description" content="Order food from campus restaurants, track your order live, and skip the line." />
  <meta property="og:url" content="https://cafecampus-client.onrender.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CaféCampus — Order. Track. Eat." />
  <meta name="twitter:description" content="Order food from campus restaurants, track your order live, and skip the line." />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
