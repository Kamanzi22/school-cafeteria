<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121212" />
  <!-- Lets phones install the site to the home screen — required for push notifications on iPhone. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="CaféCampus" />
  <!-- An iPhone home-screen app ignores theme-color and draws a white status bar (time,
       battery) unless told otherwise; "black" matches the dark customer app. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <!-- restaurant. and superadmin. subdomains are served this customer page for their short
       addresses (Render rewrites can't match on host). Safari reads the customer app name and
       manifest before any script can swap them, so jump straight to the internal address, which
       Render serves as admin.html / superadmin.html with the right name built in. portal.js then
       puts the short address back in the address bar. Keep the mapping in step with portal.js. -->
  <script>
    (function () {
      var sub = location.hostname.split('.')[0], path = location.pathname, to
      if (sub === 'restaurant') to = path.indexOf('/auth') === 0 ? '/restaurant' + path : '/admin' + (path === '/' ? '' : path)
      else if (sub === 'superadmin') to = '/superadmin' + (path === '/' ? '' : path)
      if (to) location.replace(to + location.search + location.hash)
    })()
  </script>
  <!-- Static baseline for crawlers/link-preview bots that don't execute JS (Bing, WhatsApp,
       iMessage, Twitter, Facebook). Helmet (see src/components/Seo.jsx) overrides these per
       route for JS-capable crawlers like Googlebot — this tag is what everyone else sees. -->
  <title>CaféCampus — Order. Track. Eat.</title>
  <meta name="description" content="Order food from campus restaurants, track your order live, and skip the line. Browse menus from campus eateries and pay on pickup or delivery." />
  <link rel="canonical" href="https://cafecampus-client.onrender.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CaféCampus" />
  <meta property="og:title" content="CaféCampus — Order. Track. Eat." />
  <meta property="og:description" content="Order food from campus restaurants, track your order live, and skip the line." />
  <meta property="og:url" content="https://cafecampus-client.onrender.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CaféCampus — Order. Track. Eat." />
  <meta name="twitter:description" content="Order food from campus restaurants, track your order live, and skip the line." />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <!-- Opens the connection to the API while the app's code is still downloading, so the first
       request doesn't also pay for the connection setup (~0.3 s from Rwanda). -->
  <link rel="preconnect" href="%VITE_BACKEND_URL%" crossorigin />
  <!-- The data the opened screen needs, requested now rather than after the app's code has
       downloaded and started (~0.5-1 s later on a phone): the home list, a restaurant's menu (also
       opened from shared links) or an order (opened from notifications). src/lib/earlyData.js
       hands it to that screen. Not on restaurant./superadmin. — the redirect above has already
       navigated away from those. -->
  <script>
    (function () {
      var api = '%VITE_BACKEND_URL%'
      if (api.charAt(0) === '%' || !window.fetch) return
      if (/^(restaurant|superadmin)\./.test(location.hostname)) return
      var p = location.pathname, m, path = null, withLogin = false
      if (p === '/') path = '/restaurants'
      else if ((m = p.match(/^\/restaurant\/([^/]+)\/?$/)) && m[1] !== 'auth') { path = '/restaurants/' + m[1]; withLogin = true }
      else if ((m = p.match(/^\/order\/(track|confirm)\/([^/]+)\/?$/))) path = '/orders/' + m[2]
      if (!path) return
      // A menu shows whether the signed-in customer saved it as a favorite, so that one is asked for
      // with their login, as the app would. The others don't depend on who's asking.
      var headers
      if (withLogin) try {
        var token = JSON.parse(localStorage.getItem('cc-customer-v4') || '{}').state.token
        if (token) headers = { Authorization: 'Bearer ' + token }
      } catch (e) {}
      window.__ccEarly = {}
      window.__ccEarly[path] = fetch(api + '/api' + path, headers ? { headers: headers } : undefined)
        .then(function (r) { return r.ok ? r.json() : null })
        .catch(function () { return null })
    })()
  </script>
  <!-- Painted the moment the page arrives, before the app's code has downloaded: the app's
       background and logo instead of a blank screen. React replaces the logo when the app starts. -->
  <style>
    /* :where() has no specificity, so the app's own body colours always win once its CSS loads */
    :where(body) { background: #121212; margin: 0; }
    #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot-splash img { width: 56px; height: 56px; animation: boot-pulse 1.4s ease-in-out infinite; }
    @keyframes boot-pulse { 50% { opacity: .45; } }
  </style>
</head>
<body>
  <div id="root"><div id="boot-splash"><img src="/logo-mark.svg" alt="" /></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
