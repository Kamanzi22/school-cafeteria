services:
  - type: web
    name: cafecampus-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      # Database lives in the Supabase project (see SUPABASE_URL below), not a
      # Render-managed Postgres - set directly in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      # OAuth 2.0 Web client ID from Google Cloud Console — same value as VITE_GOOGLE_CLIENT_ID
      # on the client. Without it "Continue with Google" is unavailable.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false

  - type: web
    name: cafecampus-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://cafecampus-api-feu3.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
