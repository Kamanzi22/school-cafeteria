services:
  # The API, hosted in Frankfurt next to the Supabase database (AWS eu-west-3, Paris) so each
  # query is a ~10 ms hop. It replaced an Oregon service of the same app on 2026-09-29; its
  # JWT_SECRET was copied from that service rather than generated, so nobody was logged out.
  - type: web
    name: cafecampus-api-eu
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      # Database lives in the Supabase project (see SUPABASE_URL below), not a
      # Render-managed Postgres - set directly in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      # Requests per 15 minutes per visitor IP. Students on the same school Wi-Fi share one
      # public IP, so a lunch rush of ~100 customers (~35 requests each) needs well over the
      # code's default of 1000.
      - key: RATE_LIMIT_MAX
        value: "5000"
      - key: CLIENT_URL
        sync: false
      # OAuth 2.0 Web client ID from Google Cloud Console — same value as VITE_GOOGLE_CLIENT_ID
      # on the client. Without it "Continue with Google" is unavailable.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      # Phone/browser push notifications ("your order is ready" with the app closed). Generate a
      # pair once with `npx web-push generate-vapid-keys` — they can't be auto-generated values.
      # Without them push is simply off; in-app toasts and email still work.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: cafecampus-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Order matters: specific rules first, SPA catch-all last. /admin* and /restaurant/auth* (the
    # restaurant owner/staff app) and /superadmin* each get their own HTML shell (admin.html /
    # superadmin.html) with their own web manifest baked in, so "Install app" installs as that
    # app's own identity instead of the customer one — see client/vite.config.js. Everything else
    # (including /restaurant/:id, the customer-facing menu page — never matched by /restaurant/auth*)
    # falls through to the default index.html.
    routes:
      - type: rewrite
        source: /superadmin
        destination: /superadmin.html
      - type: rewrite
        source: /superadmin/*
        destination: /superadmin.html
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /admin/*
        destination: /admin.html
      - type: rewrite
        source: /restaurant/auth
        destination: /admin.html
      - type: rewrite
        source: /restaurant/auth/*
        destination: /admin.html
      - type: rewrite
        source: /*
        destination: /index.html
    # Render doesn't know the .webmanifest extension, so it was serving these as
    # application/octet-stream — harmless to Safari (it parses the JSON regardless) but Android
    # Chrome's installability check can be stricter about the content type of a fetched manifest.
    headers:
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest-restaurant.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest-superadmin.webmanifest
        name: Content-Type
        value: application/manifest+json
      # Vite puts a content hash in every /assets/ filename, so a file at a given URL never
      # changes — phones can keep it instead of re-checking it on every visit. The HTML pages
      # stay uncached, so a new deploy is still picked up immediately.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_BACKEND_URL
        value: https://cafecampus-api-eu.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
