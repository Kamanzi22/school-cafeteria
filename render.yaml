services:
  - type: web
    name: cafecampus-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      # Database lives in the Supabase project (see SUPABASE_URL below), not a
      # Render-managed Postgres - set directly in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      # OAuth 2.0 Web client ID from Google Cloud Console — same value as VITE_GOOGLE_CLIENT_ID
      # on the client. Without it "Continue with Google" is unavailable.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      # Phone/browser push notifications ("your order is ready" with the app closed). Generate a
      # pair once with `npx web-push generate-vapid-keys` — they can't be auto-generated values.
      # Without them push is simply off; in-app toasts and email still work.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: cafecampus-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Order matters: specific rules first, SPA catch-all last. /admin* and /restaurant/auth* (the
    # restaurant owner/staff app) and /superadmin* each get their own HTML shell (admin.html /
    # superadmin.html) with their own web manifest baked in, so "Install app" installs as that
    # app's own identity instead of the customer one — see client/vite.config.js. Everything else
    # (including /restaurant/:id, the customer-facing menu page — never matched by /restaurant/auth*)
    # falls through to the default index.html.
    routes:
      - type: rewrite
        source: /superadmin
        destination: /superadmin.html
      - type: rewrite
        source: /superadmin/*
        destination: /superadmin.html
      - type: rewrite
        source: /admin
        destination: /admin.html
      - type: rewrite
        source: /admin/*
        destination: /admin.html
      - type: rewrite
        source: /restaurant/auth
        destination: /admin.html
      - type: rewrite
        source: /restaurant/auth/*
        destination: /admin.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://cafecampus-api-feu3.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
